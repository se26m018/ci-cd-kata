name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Level 2: Linting vor den Tests
      - name: Run Linter
        run: npm run lint

      - name: Run tests
        run: npm test

      # Level 3: Artifact hochladen (packt die Dateien automatisch als ZIP auf GitHub)
      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-files
          path: |
            app.js
            package.json
